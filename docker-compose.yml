services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studio_leonardkabo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
