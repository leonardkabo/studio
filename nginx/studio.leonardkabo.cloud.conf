# Configuration Nginx pour studio.leonardkabo.cloud
# À placer dans : /etc/nginx/sites-available/studio.leonardkabo.cloud
# Puis créer le lien : sudo ln -s /etc/nginx/sites-available/studio.leonardkabo.cloud /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name studio.leonardkabo.cloud;

    # Autoriser l'envoi de photos haute résolution jusqu'à 100 Mo
    client_max_body_size 100M;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs dédiés pour le studio
    access_log /var/log/nginx/studio_access.log;
    error_log /var/log/nginx/studio_error.log;

    location / {
        # Redirection vers le conteneur Docker ou le serveur Node local (Port 3005)
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        # Gestion des connexions persistantes et WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # En-têtes pour conserver l'IP réelle et le protocole
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts adaptés aux traitements d'analyse d'images lourdes
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
